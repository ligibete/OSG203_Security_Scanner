<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSG203 // TACTICAL SCANNER</title>
    <!-- Technical & Monospace Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Tactical SOC Palette */
            --bg-dark: #05050A;
            --bg-panel: rgba(10, 15, 25, 0.7);
            --bg-detail: rgba(15, 20, 35, 0.9);
            --cyan: #00f3ff;
            --cyan-dim: rgba(0, 243, 255, 0.2);
            --red: #ff003c;
            --yellow: #ffb700;
            --green: #00ff66;
            --grid-line: rgba(0, 243, 255, 0.05);
            --text-main: #c0caf5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            /* Sci-Fi Grid Background */
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Typography & Glow */
        h1, h2, h3 { font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glow-cyan { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 243, 255, 0.6); }
        .glow-red { color: var(--red); text-shadow: 0 0 8px rgba(255, 0, 60, 0.6); }
        .glow-yellow { color: var(--yellow); text-shadow: 0 0 8px rgba(255, 183, 0, 0.6); }
        .glow-green { color: var(--green); text-shadow: 0 0 8px rgba(0, 255, 102, 0.6); }

        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--cyan-dim);
            padding-bottom: 15px; margin-bottom: 25px;
            position: relative;
        }
        header::after {
            content: ''; position: absolute; bottom: -1px; left: 0; width: 200px; height: 1px; background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }
        .header-title { display: flex; align-items: center; font-size: 1.8rem; color: var(--cyan); }
        .live-dot {
            width: 10px; height: 10px; background-color: var(--red);
            border-radius: 50%; margin-left: 15px;
            box-shadow: 0 0 10px var(--red);
            animation: blink 1.5s infinite;
        }
        .header-stats { text-align: right; font-size: 1.1rem; color: var(--cyan); }
        .stat-value { font-weight: 700; margin-left: 8px; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Main Layout Grid */
        .hud-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            flex: 1;
            align-items: start;
        }

        /* Tactical Panels (Clip-path Chamfered Edges) */
        .panel {
            background: var(--bg-panel);
            backdrop-filter: blur(5px);
            border: 1px solid var(--cyan-dim);
            padding: 20px;
            position: relative;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        .panel::before { content: ''; position: absolute; top: 0; left: 0; width: 15px; height: 2px; background: var(--cyan); }
        .panel::after { content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 15px; background: var(--cyan); }

        /* Left Panel: Monitor & Terminal */
        .radar-box {
            display: flex; justify-content: center; align-items: center;
            height: 220px; margin: 20px 0;
        }
        .radar {
            width: 180px; height: 180px; border-radius: 50%;
            border: 1px solid var(--cyan);
            background: repeating-radial-gradient(transparent, transparent 19px, var(--cyan-dim) 20px);
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.2);
        }
        .radar::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--cyan-dim); }
        .radar::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--cyan-dim); }
        .radar-sweep {
            position: absolute; top: 0; left: 50%; width: 100%; height: 50%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4));
            transform-origin: bottom left;
            animation: sweep 2.5s linear infinite;
        }
        @keyframes sweep { to { transform: rotate(360deg); } }

        .terminal {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--cyan-dim);
            padding: 12px; font-size: 0.85rem;
            height: 200px; overflow-y: auto;
            display: flex; flex-direction: column;
            gap: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .term-prefix { color: var(--cyan); margin-right: 8px; }

        /* Right Panel: Threat Intel Table */
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid var(--cyan-dim); padding-bottom: 10px;
        }
        
        .btn-scan {
            background: var(--cyan-dim); color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 8px 24px; font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700;
            text-transform: uppercase; cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s;
        }
        .btn-scan:hover:not(:disabled) {
            background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan);
        }
        .btn-scan:disabled { opacity: 0.5; cursor: wait; border-color: #555; color: #555; }

        /* Accordion Table Styling (Hybrid UX) */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            color: var(--cyan); font-weight: 600; padding: 12px 16px;
            border-bottom: 1px solid var(--cyan); text-transform: uppercase; letter-spacing: 1px;
        }
        
        /* Main Row (Clickable) */
        .tr-main {
            cursor: pointer; transition: all 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tr-main:hover {
            background: rgba(0, 243, 255, 0.05);
        }
        .tr-main td { padding: 14px 16px; font-size: 0.95rem; }
        .row-chevron { color: var(--cyan); transition: transform 0.3s; display: inline-block; width: 15px;}
        .tr-main.active { background: rgba(0, 243, 255, 0.08); border-bottom: none; }
        .tr-main.active .row-chevron { transform: rotate(90deg); }

        /* Badges */
        .badge { padding: 4px 10px; border: 1px solid; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; }
        .badge.critical { border-color: var(--red); color: var(--red); background: rgba(255, 0, 60, 0.1); box-shadow: 0 0 5px rgba(255, 0, 60, 0.3); }
        .badge.warning { border-color: var(--yellow); color: var(--yellow); background: rgba(255, 183, 0, 0.1); box-shadow: 0 0 5px rgba(255, 183, 0, 0.3); }
        .badge.secure { border-color: var(--green); color: var(--green); background: rgba(0, 255, 102, 0.1); box-shadow: 0 0 5px rgba(0, 255, 102, 0.3); }

        /* Detail Row (Accordion Content) */
        .tr-detail { display: none; }
        .tr-detail.open { display: table-row; }
        .tr-detail td { padding: 0; border-bottom: 1px solid var(--cyan-dim); }
        
        /* Detail Container matching Image 2 Layout */
        .detail-container {
            background: var(--bg-detail);
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.5);
            border-left: 2px solid var(--cyan);
        }

        .info-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .info-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }
        .info-box {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 12px; font-size: 0.9rem; color: #fff;
            border-radius: 4px;
        }
        .info-box.danger { border-color: rgba(255,0,60,0.4); color: #ff8a9f; }

        /* Code Remediation Area */
        .remediation-area { display: flex; flex-direction: column; gap: 8px; height: 100%; }
        .code-box-wrapper {
            position: relative; flex: 1;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 4px; padding: 15px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .code-box-wrapper pre {
            color: var(--green); font-size: 0.85rem; white-space: pre-wrap; margin: 0; line-height: 1.5;
        }
        
        /* Interactive Copy Button */
        .btn-copy {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 255, 102, 0.1); border: 1px solid var(--green);
            color: var(--green); padding: 4px 12px; font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem; font-weight: bold; cursor: pointer;
            opacity: 0; transform: translateY(-5px); transition: all 0.2s ease;
            border-radius: 2px;
        }
        .code-box-wrapper:hover .btn-copy { opacity: 1; transform: translateY(0); }
        .btn-copy:hover { background: var(--green); color: #000; }
        .btn-copy.success { background: var(--cyan); border-color: var(--cyan); color: #000; }

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title">
            OSG203 // TACTICAL SCANNER <div class="live-dot"></div>
        </div>
        <div class="header-stats">
            <div>THREAT LEVEL: <span class="stat-value glow-red" id="globalThreat">ELEVATED</span></div>
            <div>SCANS COMPILED: <span class="stat-value" id="scanCount">142</span></div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="hud-layout">
        
        <!-- Left: System Monitor -->
        <aside class="panel">
            <h3 class="glow-cyan">SYS_MONITOR</h3>
            <div class="radar-box">
                <div class="radar"><div class="radar-sweep"></div></div>
            </div>
            <div class="terminal font-mono" id="terminal">
                <div><span class="term-prefix">[SYS]</span>Kernel loaded successfully.</div>
                <div><span class="term-prefix">[SYS]</span>Establishing secure DB connection... OK.</div>
                <div><span class="term-prefix">[SYS]</span>Awaiting manual override...</div>
            </div>
        </aside>

        <!-- Right: Threat Intelligence Table -->
        <main class="panel">
            <div class="panel-header">
                <h3 class="glow-cyan">THREAT INTELLIGENCE</h3>
                <button class="btn-scan" id="btnScan" onclick="triggerScan()">[ INITIATE SCAN ]</button>
            </div>
            
            <div style="overflow-x: auto;">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th width="5%"></th>
                            <th width="20%">TIME_STAMP</th>
                            <th width="35%">TARGET_MODULE</th>
                            <th width="40%">RISK_ASSESSMENT</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // --- Mock Data ---
        let totalScans = 142;
        let tableData = [
            { 
                id: 'scan-001', time: "19:42:01", module: "check_suid", risk: "CRITICAL", 
                message: "SUID bit set on dangerous binary.",
                file: "/usr/bin/nmap", state: "SUID bit explicitly enabled (root)", 
                remediation: "sudo chmod u-s /usr/bin/nmap\nsudo systemctl daemon-reload" 
            },
            { 
                id: 'scan-002', time: "19:41:33", module: "check_packages", risk: "CRITICAL", 
                message: "Vulnerable version of OpenSSL detected (CVE-2026-XXXX).",
                file: "dpkg -l | grep openssl", state: "openssl 1.1.1f-1ubuntu2 (VULNERABLE)", 
                remediation: "sudo apt-get update\nsudo apt-get install --only-upgrade openssl\nsudo systemctl restart nginx" 
            },
            { 
                id: 'scan-003', time: "19:38:15", module: "check_ssh", risk: "WARNING", 
                message: "Root login is permitted via SSH.",
                file: "/etc/ssh/sshd_config", state: "PermitRootLogin yes", 
                remediation: "sed -i 's/PermitRootLogin yes/PermitRootLogin no/g' /etc/ssh/sshd_config\nsudo systemctl reload sshd" 
            },
            { 
                id: 'scan-004', time: "19:35:44", module: "check_users", risk: "SECURE", 
                message: "No unauthorized UID 0 accounts found.",
                file: "/etc/passwd", state: "Root account integrity verified.", 
                remediation: "# System is secure. No action required." 
            }
        ];

        // --- UI Helpers ---
        function getBadgeHtml(risk) {
            const r = risk.toUpperCase();
            if (r === 'CRITICAL') return `<span class="badge font-mono critical">&bull; ${r}</span>`;
            if (r === 'WARNING') return `<span class="badge font-mono warning">&bull; ${r}</span>`;
            return `<span class="badge font-mono secure">&bull; ${r}</span>`;
        }

        // --- Render Table & Accordion ---
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            tableData.forEach((item, index) => {
                // 1. Main Row
                const trMain = document.createElement('tr');
                trMain.className = 'tr-main font-mono';
                trMain.onclick = () => toggleRow(index);
                trMain.innerHTML = `
                    <td style="text-align: center;"><span class="row-chevron" id="icon-${index}">&#9656;</span></td>
                    <td>${item.time}</td>
                    <td>${item.module}</td>
                    <td>${getBadgeHtml(item.risk)} <span style="font-size:0.8rem; margin-left:10px; color:rgba(255,255,255,0.5); font-family: 'Rajdhani', sans-serif;">${item.message.substring(0, 30)}...</span></td>
                `;

                // 2. Detail Row (Hidden Accordion)
                const trDetail = document.createElement('tr');
                trDetail.className = 'tr-detail';
                trDetail.id = `detail-${index}`;
                
                const isSecure = item.risk === 'SECURE';
                const stateClass = isSecure ? 'info-box' : 'info-box danger font-mono';
                
                trDetail.innerHTML = `
                    <td colspan="4">
                        <div class="detail-container">
                            <!-- Left: Context -->
                            <div>
                                <div class="info-group">
                                    <div class="info-label">Target File / Resource</div>
                                    <div class="info-box font-mono" style="color:var(--cyan)">${item.file}</div>
                                </div>
                                <div class="info-group">
                                    <div class="info-label">Current Value Detected</div>
                                    <div class="${stateClass}">${item.state}</div>
                                </div>
                            </div>
                            <!-- Right: Remediation -->
                            <div class="remediation-area">
                                <div class="info-label">Recommended Remediation</div>
                                <div class="code-box-wrapper">
                                    <pre>${item.remediation}</pre>
                                    <button class="btn-copy" onclick="copyCode(this, \`${item.remediation.replace(/`/g, '\\`')}\`)">COPY CODE</button>
                                </div>
                            </div>
                        </div>
                    </td>
                `;

                tbody.appendChild(trMain);
                tbody.appendChild(trDetail);
            });
        }

        // --- Accordion Logic ---
        function toggleRow(index) {
            const detailRow = document.getElementById(`detail-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            const mainRow = detailRow.previousElementSibling;

            // Optional: Close all others first for exclusive accordion
            document.querySelectorAll('.tr-detail').forEach(row => {
                if(row.id !== `detail-${index}`) {
                    row.classList.remove('open');
                    row.previousElementSibling.classList.remove('active');
                }
            });

            // Toggle target
            if (detailRow.classList.contains('open')) {
                detailRow.classList.remove('open');
                mainRow.classList.remove('active');
            } else {
                detailRow.classList.add('open');
                mainRow.classList.add('active');
                logTerminal(`[OPR] Investigating ${tableData[index].module} details...`);
            }
        }

        // --- Utilities ---
        function copyCode(btn, text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            btn.innerText = 'COPIED!';
            btn.classList.add('success');
            logTerminal('[SYS] Remediation payload copied to clipboard.');

            setTimeout(() => {
                btn.innerText = 'COPY CODE';
                btn.classList.remove('success');
            }, 2000);
        }

        function logTerminal(msg) {
            const term = document.getElementById('terminal');
            const div = document.createElement('div');
            div.innerHTML = `<span class="term-prefix">[SYS]</span>${msg}`;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        // --- Simulated Scan Process ---
        function triggerScan() {
            const btn = document.getElementById('btnScan');
            btn.disabled = true;
            btn.innerText = '[ SCANNING... ]';
            
            // Close any open accordions
            document.querySelectorAll('.tr-detail').forEach(r => r.classList.remove('open'));
            document.querySelectorAll('.tr-main').forEach(r => r.classList.remove('active'));

            logTerminal('<span class="glow-yellow">Initiating full system diagnostic...</span>');
            setTimeout(() => logTerminal('Scanning /etc/shadow hashes...'), 600);
            setTimeout(() => logTerminal('Analyzing firewall rule configurations...'), 1500);

            setTimeout(() => {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', {hour12: false});
                
                tableData.unshift({
                    id: `scan-${Date.now()}`, time: timeStr, module: "check_firewall", risk: "CRITICAL", 
                    message: "UFW is inactive. System exposed to external networks.",
                    file: "sudo ufw status", state: "Status: inactive", 
                    remediation: "sudo ufw default deny incoming\nsudo ufw default allow outgoing\nsudo ufw enable"
                });

                totalScans++;
                document.getElementById('scanCount').innerText = totalScans;
                renderTable();

                btn.disabled = false;
                btn.innerText = '[ INITIATE SCAN ]';
                logTerminal('<span class="glow-red">Alert: New vulnerabilities detected!</span>');
                
                // Automatically expand the new row
                setTimeout(() => toggleRow(0), 300);
            }, 3000);
        }

        // Init
        window.onload = renderTable;
    </script>
</body>
</html>
