<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>OSG203 // Tactical Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .radar-sweep {
            background: conic-gradient(from 0deg, transparent 70%, rgba(6, 182, 212, 0.5) 100%);
            animation: scan-radar 3s linear infinite;
            border-radius: 50%;
        }
        @keyframes scan-radar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-[#050b14] text-gray-300 font-mono min-h-screen p-6">
    <div class="max-w-[1400px] mx-auto flex flex-col lg:flex-row gap-8">
        
        <!-- CỘT TRÁI: RADAR & LOGS -->
        <div class="w-full lg:w-1/3 flex flex-col gap-6">
            <h1 class="text-2xl font-bold text-cyan-400 tracking-wider mb-2">OSG203 // TACTICAL SCANNER <span class="inline-block w-3 h-3 bg-red-500 rounded-full animate-pulse ml-2"></span></h1>
            
            <div class="border border-slate-800 bg-[#0a101a] p-4 font-bold text-cyan-500 text-sm tracking-widest rounded-t-md">SYS_MONITOR</div>
            <!-- Radar Box -->
            <div class="border-x border-b border-slate-800 bg-[#0a101a] h-64 flex justify-center items-center relative overflow-hidden -mt-6">
                <div class="w-44 h-44 rounded-full border border-cyan-800/50 relative">
                    <div class="absolute inset-0 flex items-center justify-center"><div class="w-full h-[1px] bg-cyan-900/50"></div></div>
                    <div class="absolute inset-0 flex items-center justify-center"><div class="h-full w-[1px] bg-cyan-900/50"></div></div>
                    <div class="absolute inset-0 rounded-full border border-cyan-800/30 scale-50"></div>
                    <div class="absolute inset-0 radar-sweep"></div>
                </div>
            </div>

            <!-- Log Box -->
            <div class="border border-slate-800 bg-[#0a101a] p-4 text-[11px] h-48 overflow-y-auto space-y-2 rounded-b-md">
                <div class="text-cyan-500">[SYS] Initializing OSG203 Engine...</div>
                <div class="text-cyan-500">[SYS] System ready. Awaiting command...</div>
                <div id="terminal-log"></div>
            </div>

            <!-- Nút Scan -->
            <button onclick="triggerScan()" class="w-full border border-cyan-600 bg-cyan-900/20 hover:bg-cyan-800/40 text-cyan-400 py-3 font-bold transition shadow-[0_0_15px_rgba(6,182,212,0.15)] rounded">
                [ INITIATE FULL SCAN ]
            </button>
        </div>

        <!-- CỘT PHẢI: KẾT QUẢ QUÉT (RESULTS) -->
        <div class="w-full lg:w-2/3 flex flex-col gap-6">
            <div class="flex justify-between items-end mb-2">
                <div class="text-cyan-500 font-bold text-sm tracking-widest mt-10 lg:mt-0">THREAT INTELLIGENCE</div>
            </div>

            <div class="border border-slate-800 bg-[#0a101a] rounded-md p-6 overflow-x-auto min-h-[500px]">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-cyan-900/50 text-cyan-600 text-xs">
                            <th class="py-3 px-2 font-bold w-12">ID</th>
                            <th class="py-3 px-2 font-bold">TIME_STAMP</th>
                            <th class="py-3 px-2 font-bold">MODULE</th>
                            <th class="py-3 px-2 font-bold text-center">RISK_LEVEL</th>
                            <th class="py-3 px-2 font-bold text-right">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="results-table">
                        <tr><td colspan="5" class="text-slate-500 text-center py-10">[ Đang chờ dữ liệu quét... ]</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        function fetchResults() {
            fetch('/api/results')
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        let tbody = document.getElementById('results-table');
                        tbody.innerHTML = '';
                        
                        if (data.data.length === 0) {
                            tbody.innerHTML = `<tr><td colspan="5" class="text-slate-500 text-center py-10">[ Không có dữ liệu quét trong hệ thống ]</td></tr>`;
                            return;
                        }
                        
                        data.data.forEach(item => {
                            let isSecure = item.risk_level === 'SECURE';
                            
                            let riskBadge = isSecure 
                                ? `<span class="text-emerald-400 border border-emerald-500/30 bg-emerald-500/10 px-2 py-1 text-[10px] rounded font-bold">[ SECURE ]</span>`
                                : `<span class="text-yellow-400 border border-yellow-500/30 bg-yellow-500/10 px-2 py-1 text-[10px] rounded font-bold">[ WARNING ]</span>`;
                            
                            let actionHtml = '';
                            if (!isSecure) {
                                actionHtml = `
                                    <div class="flex justify-end gap-2" id="action-group-${item.module_name}">
                                        <button onclick="handleRemediate('${item.module_name}', 'approve')" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 px-3 py-1.5 text-[11px] font-bold hover:bg-emerald-500 hover:text-black transition rounded-sm shadow-[0_0_10px_rgba(16,185,129,0.15)]">
                                            [ ✓ FIX ]
                                        </button>
                                        <button onclick="handleIgnore('${item.module_name}')" class="bg-red-500/20 text-red-400 border border-red-500/50 px-3 py-1.5 text-[11px] font-bold hover:bg-red-500 hover:text-white transition rounded-sm shadow-[0_0_10px_rgba(239,68,68,0.15)]">
                                            [ ✗ IGNORE ]
                                        </button>
                                    </div>
                                `;
                            }

                            let mainRow = `
                                <tr class="border-t border-slate-800/50 group" id="row-main-${item.module_name}">
                                    <td class="py-4 px-2 text-slate-500 text-xs">${item.id || '-'}</td>
                                    <td class="py-4 px-2 text-cyan-500 text-xs">${item.scan_time}</td>
                                    <td class="py-4 px-2 text-white font-bold text-sm">${item.module_name}</td>
                                    <td class="py-4 px-2 text-center">${riskBadge}</td>
                                    <td class="py-4 px-2 text-right">${actionHtml}</td>
                                </tr>
                            `;

                            let diagRow = '';
                            if (!isSecure) {
                                // Đã cập nhật logic hiển thị mockCmd chuẩn
                                let mockCmd = '$ Manual investigation required.';
                                
                                if (item.module_name === 'check_ssh') {
                                    mockCmd = '$ sed -i "s/^PermitRootLogin.*yes/PermitRootLogin no/" /host_etc/ssh/sshd_config && sudo systemctl restart ssh';
                                } else if (item.module_name === 'check_password_policy') {
                                    mockCmd = '$ sed -i "s/^PASS_MAX_DAYS.*/PASS_MAX_DAYS   90/g" /host_etc/login.defs';
                                } else if (item.module_name === 'check_firewall') {
                                    mockCmd = '$ ufw enable && ufw default deny incoming';
                                }

                                diagRow = `
                                    <tr id="row-diag-${item.module_name}">
                                        <td colspan="5" class="pb-6 px-2">
                                            <div class="border-l-2 border-red-500 bg-[#0a101a] p-4 ml-2 shadow-lg border border-slate-800/50 relative overflow-hidden">
                                                <div class="absolute left-0 top-0 bottom-0 w-16 bg-gradient-to-r from-red-500/10 to-transparent pointer-events-none"></div>
                                                <div class="text-red-500 text-[10px] font-bold mb-2 tracking-wider">● DIAGNOSTIC FINDING</div>
                                                <div class="text-slate-300 text-xs mb-4 pl-4">${item.message}</div>
                                                
                                                <div class="text-cyan-500 text-[10px] font-bold mb-2 tracking-wider">● RECOMMENDED EXECUTION</div>
                                                <div class="bg-black/80 border border-slate-800 text-emerald-400 font-mono text-[11px] p-3 rounded-sm pl-4">
                                                    ${mockCmd}
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                `;
                            }
                            
                            tbody.innerHTML += mainRow + diagRow;
                        });
                    }
                });
        }

        function triggerScan() {
            let logBox = document.getElementById('terminal-log');
            logBox.innerHTML += `<div class="text-yellow-400 mt-1">[WARN] Initiating system scan via main.sh...</div>`;
            logBox.scrollTop = logBox.scrollHeight;
            
            fetch('/api/scan', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        logBox.innerHTML += `<div class="text-emerald-400 mt-1">[SYS] Scan sequence completed successfully.</div>`;
                        fetchResults();
                    } else {
                        logBox.innerHTML += `<div class="text-red-500 mt-1">[ERROR] Scan failed: ${data.message}</div>`;
                    }
                    logBox.scrollTop = logBox.scrollHeight;
                });
        }

        function handleRemediate(moduleName, action) {
            let btnGroup = document.getElementById(`action-group-${moduleName}`);
            btnGroup.innerHTML = `<span class="text-yellow-400 text-[11px] animate-pulse font-bold border border-yellow-500/50 px-3 py-1 bg-yellow-500/10 rounded">[ FIXING... ]</span>`;

            let formData = new FormData();
            formData.append('action', action);

            fetch(`/remediate/${moduleName}`, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    btnGroup.innerHTML = `<span class="text-emerald-400 text-[11px] font-bold border border-emerald-500/50 px-3 py-1 bg-emerald-500/10 rounded">[ SECURE ]</span>`;
                    setTimeout(() => { fetchResults(); }, 1200);
                }
            });
        }

        function handleIgnore(moduleName) {
            let mainRow = document.getElementById(`row-main-${moduleName}`);
            let diagRow = document.getElementById(`row-diag-${moduleName}`);
            
            if (mainRow) mainRow.classList.add('fade-out');
            if (diagRow) diagRow.classList.add('fade-out');
            
            setTimeout(() => { 
                if (mainRow) mainRow.remove(); 
                if (diagRow) diagRow.remove(); 
            }, 500);
        }

        window.onload = fetchResults;
    </script>
</body>
</html>
