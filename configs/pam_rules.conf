# CẤU HÌNH QUY TẮC XÁC THỰC PAM (Task 2.3)
# ==========================================

# Độ dài tối thiểu của mật khẩu
PAM_MIN_PASSWORD_LENGTH="8"

# Bắt buộc mật khẩu phức tạp (1 hoa, 1 thường, 1 số, 1 đặc biệt)
PAM_REQUIRE_COMPLEXITY="yes"

# Số lần nhập sai mật khẩu tối đa trước khi khóa tài khoản
PAM_MAX_AUTH_TRIES="5"

# Thời gian khóa tài khoản nếu nhập sai (Tính bằng giây: 900s = 15 phút)
PAM_LOCKOUT_TIME="900"

