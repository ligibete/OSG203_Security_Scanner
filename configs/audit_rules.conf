# ==============================================================================
# configs/audit_rules.conf - Cấu hình Ngưỡng & Tham số Dò quét Bảo mật OSG203
# ==============================================================================

# 1. Cấu hình Tài khoản & Xác thực (Module Users)
MAX_PASSWORD_AGE_DAYS=90
MIN_PASSWORD_AGE_DAYS=7
WARN_PASSWORD_AGE_DAYS=14
ALLOW_UID_ZERO_ROOT_ONLY=true

# 2. Cấu hình SSH Server
SSH_PERMIT_ROOT_LOGIN=no
SSH_PERMIT_EMPTY_PASSWORDS=no
SSH_MAX_AUTH_TRIES=4
SSH_X11_FORWARDING=no
SSH_RECOMMENDED_PORT=2222

# 3. Cấu hình Tường lửa (UFW)
UFW_REQUIRE_ACTIVE=true
UFW_DEFAULT_INCOMING=deny
UFW_DEFAULT_OUTGOING=allow

# 4. Phân quyền Tệp tin Nhạy cảm (File Permissions)
PERM_SHADOW=600
PERM_PASSWD=644
PERM_SUDOERS=440
PERM_SSH_CONFIG=600
